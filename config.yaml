ollama:
  host: http://localhost:11434
  embed_model: mxbai-embed-large  # unused when embedding.backend = sentence-transformers
  request_timeout_s: 180
  default_model: qwen2.5:7b
  models:
    - name: qwen2.5:7b
      label: Qwen 2.5 · 通用
      reasoning: false
    - name: deepseek-r1:8b
      label: DeepSeek R1 · 推理
      reasoning: true

embedding:
  backend: sentence-transformers   # "ollama" | "sentence-transformers"
  st_model: paraphrase-multilingual-MiniLM-L12-v2   # ~120 MB, CPU, 中英双语

ocr:
  enabled: true        # 扫描版 PDF 自动 OCR(需 pip install pymupdf rapidocr-onnxruntime)
  dpi: 150             # 渲染分辨率,越高越准但越慢

rag:
  chunk_size: 500
  chunk_overlap: 80
  top_k: 4
  reward_weight: 0.3
  min_similarity: 0.15

generation:
  temperature: 0.3
  max_tokens: 400          # 偏保守,避免 Turing 上某些 batch 大小触发 CUDA kernel bug
  logprobs_top_k: 0        # 0 = 关闭 logprobs(已知会触发 Turing CUDA bug)
  system_prompt: |
    你是一个严谨、专业的本地助手。请基于提供的"参考材料"回答用户问题。
    如果参考材料没有足够信息,直接说明,不要编造。
    回答用中文,简洁清晰。You may answer in English if the user writes in English.

paths:
  data_dir: ./data
  uploads_dir: ./data/uploads
  vector_dir: ./data/vector_store
  db_path: ./data/monitoring.db
