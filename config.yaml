ollama:
  host: http://localhost:11434
  embed_model: mxbai-embed-large  # unused when embedding.backend = sentence-transformers
  request_timeout_s: 600   # CPU 推理较慢,给 10 分钟避免长回答被 HTTP 超时掐断
  default_model: qwen2.5:7b-instruct-q4_0
  models:
    - name: qwen2.5:7b-instruct-q4_0
      label: Qwen 2.5 · 通用
      reasoning: false
    - name: deepseek-r1:8b
      label: DeepSeek R1 · 推理
      reasoning: true

embedding:
  backend: sentence-transformers   # "ollama" | "sentence-transformers"
  st_model: paraphrase-multilingual-MiniLM-L12-v2   # ~120 MB, CPU, 中英双语

ocr:
  enabled: true        # 扫描版 PDF 自动 OCR(需 pip install pymupdf rapidocr-onnxruntime)
  dpi: 150             # 渲染分辨率,越高越准但越慢

rag:
  chunk_size: 500
  chunk_overlap: 80
  top_k: 4
  reward_weight: 0.3
  min_similarity: 0.15

generation:
  temperature: 0.3
  max_tokens: 800          # 输出上限 800 token；输入预算 = 2048-800 = 1248 (top_k×chunk≈1000, q≈150 ✓)
  num_ctx: 2048            # Turing SM7.5 RoPE kernel crash zone: ctx>=4096 + num_gpu>0 → illegal mem
  num_gpu: 29              # RTX2070 full offload; REQUIRES OLLAMA_CONTEXT_LENGTH=2048 in env (registry fixed)
  keep_alive: 600          # 模型加载一次后保持10分钟,避免每次请求重新加载30s
  logprobs_top_k: 0        # 0 = 关闭 logprobs(已知会触发 Turing CUDA bug)
  system_prompt: |
    你是一个严谨、专业的本地助手。请基于提供的"参考材料"回答用户问题。
    如果参考材料没有足够信息,直接说明,不要编造。
    回答用中文,简洁清晰。You may answer in English if the user writes in English.

paths:
  data_dir: ./data
  uploads_dir: ./data/uploads
  vector_dir: ./data/vector_store
  db_path: ./data/monitoring.db
