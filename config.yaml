ollama:
  host: http://localhost:11434
  chat_model: qwen2.5:7b
  embed_model: bge-m3
  request_timeout_s: 120

rag:
  chunk_size: 500
  chunk_overlap: 80
  top_k: 4
  reward_weight: 0.3
  min_similarity: 0.15

generation:
  temperature: 0.3
  max_tokens: 800
  logprobs_top_k: 5
  system_prompt: |
    你是一个严谨、专业的本地助手。请基于提供的"参考材料"回答用户问题。
    如果参考材料没有足够信息,直接说明,不要编造。
    回答用中文,简洁清晰。You may answer in English if the user writes in English.

paths:
  data_dir: ./data
  uploads_dir: ./data/uploads
  vector_dir: ./data/vector_store
  db_path: ./data/monitoring.db
