ollama:
  host: http://localhost:11434
  embed_model: bge-m3
  request_timeout_s: 180
  default_model: qwen2.5:7b
  models:
    - name: qwen2.5:7b
      label: Qwen 2.5 · 通用对话
      reasoning: false
    - name: deepseek-r1:7b
      label: DeepSeek R1 · 推理
      reasoning: true

ocr:
  enabled: true        # 扫描版 PDF 自动 OCR(需 pip install pymupdf rapidocr-onnxruntime)
  dpi: 200             # 渲染分辨率,越高越准但越慢

rag:
  chunk_size: 500
  chunk_overlap: 80
  top_k: 4
  reward_weight: 0.3
  min_similarity: 0.15

generation:
  temperature: 0.3
  max_tokens: 800
  logprobs_top_k: 0       # 设 0 = 关闭 logprobs (RTX 2070 + Ollama 0.24 已知 CUDA kernel bug);修好或升级后可改回 5
  system_prompt: |
    你是一个严谨、专业的本地助手。请基于提供的"参考材料"回答用户问题。
    如果参考材料没有足够信息,直接说明,不要编造。
    回答用中文,简洁清晰。You may answer in English if the user writes in English.

paths:
  data_dir: ./data
  uploads_dir: ./data/uploads
  vector_dir: ./data/vector_store
  db_path: ./data/monitoring.db
